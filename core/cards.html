<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Test Run Report</title>
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --line: #2a313c; --text: #e6edf3; --muted: #8b949e;
    --pass: #3fb950; --pass-soft: #12261a; --fail: #f85149; --fail-soft: #2d1215;
    --warn: #d29922; --warn-soft: #2b2111; --accent: #6c9bff; --skip: #8b949e;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.45 "Segoe UI", system-ui, -apple-system, sans-serif; }
  body { min-height: 100vh; }
  .view { display: none; padding: 48px 64px; }
  .view.on { display: block; }
  .kicker { color: var(--accent); font-weight: 600; letter-spacing: .08em; text-transform: uppercase; font-size: 14px; }
  h1 { font-size: 56px; margin: 8px 0 4px; letter-spacing: -.01em; }
  h2 { font-size: 34px; margin: 6px 0 20px; }
  .sub { color: var(--muted); font-size: 20px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; margin-top: 36px; }
  .tile { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px; }
  .tile b { display: block; font-size: 18px; margin-bottom: 4px; }
  .tile span { color: var(--muted); font-size: 15px; }
  .stats { display: flex; gap: 14px; flex-wrap: wrap; margin-bottom: 22px; }
  .stat { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 18px; min-width: 150px; }
  .stat .v { font-size: 34px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .stat .k { color: var(--muted); font-size: 14px; }
  .v.pass { color: var(--pass); } .v.fail { color: var(--fail); } .v.warn { color: var(--warn); } .v.skip { color: var(--skip); }
  .group { margin-bottom: 18px; }
  .group h3 { font-size: 17px; margin: 0 0 6px; color: var(--accent); }
  .row { display: grid; grid-template-columns: 26px 1fr auto; gap: 10px; align-items: baseline;
         padding: 4px 10px; border-radius: 8px; font-size: 15.5px; }
  .row:nth-child(even) { background: rgb(255 255 255 / .025); }
  .row .t { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 13px; }
  .row .why { grid-column: 2 / -1; color: var(--muted); font-size: 13.5px; }
  .ic { font-weight: 800; text-align: center; }
  .ic.passed { color: var(--pass); } .ic.failed { color: var(--fail); }
  .ic.xfailed, .ic.xpassed { color: var(--warn); } .ic.skipped { color: var(--skip); }
  #unitScroll { height: calc(100vh - 250px); overflow: hidden; position: relative; }
  #unitScroll::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 60px;
    background: linear-gradient(transparent, var(--bg)); pointer-events: none; }
  .verdict { font-size: 44px; font-weight: 800; margin: 6px 0 22px; }
  .verdict.pass { color: var(--pass); } .verdict.fail { color: var(--fail); }
  .cols { display: grid; grid-template-columns: 1.3fr 1fr; gap: 28px; }
  .issue { background: var(--warn-soft); border: 1px solid #5a4514; border-radius: 10px; padding: 8px 12px; margin-bottom: 8px; font-size: 14.5px; }
  .issue.fail { background: var(--fail-soft); border-color: #5c1f22; }
  .muted { color: var(--muted); }
  @media (max-width: 900px) { .view { padding: 24px 16px; } .cols { grid-template-columns: 1fr; } h1 { font-size: 36px; } }
</style>
</head>
<body>
<section class="view" id="title">
  <div class="kicker">Automated test run</div>
  <h1 id="titleName"></h1>
  <div class="sub" id="titleSub"></div>
  <div class="grid" id="titleGrid"></div>
</section>

<section class="view" id="unit">
  <div class="kicker">Part 1</div>
  <h2>Automated test suite</h2>
  <div class="stats" id="unitStats"></div>
  <div id="unitScroll"><div id="unitList"></div></div>
</section>

<section class="view" id="summary">
  <div class="kicker">Results</div>
  <div class="verdict" id="verdict"></div>
  <div class="stats" id="sumStats"></div>
  <div class="cols">
    <div><h3 style="margin:0 0 8px">Browser tests</h3><div id="sumE2E"></div></div>
    <div><h3 style="margin:0 0 8px">Needs attention</h3><div id="sumIssues"></div></div>
  </div>
</section>

<script>
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ICON = { passed: "✓", failed: "✗", xfailed: "!", xpassed: "!", skipped: "–" };
let FILE_LABEL = {}; // set from testrun.json "suite": {"labels": {...}}
function counts(list) {
  const c = { passed: 0, failed: 0, xfailed: 0, xpassed: 0, skipped: 0 };
  list.forEach(t => c[t.outcome] = (c[t.outcome] || 0) + 1);
  return c;
}
function stat(v, k, cls) { return `<div class="stat"><div class="v ${cls}">${v}</div><div class="k">${k}</div></div>`; }

window.render = (view, data) => {
  document.querySelectorAll(".view").forEach(v => v.classList.toggle("on", v.id === view));
  if (view === "title") {
    document.getElementById("titleName").textContent = data.name || "";
    document.getElementById("titleSub").textContent = data.subtitle || "";
    document.getElementById("titleGrid").innerHTML = (data.parts || []).map(p =>
      `<div class="tile"><b>${esc(p[0])}</b><span>${esc(p[1])}</span></div>`).join("");
  }
  if (view === "unit") {
    FILE_LABEL = data.labels || {};
    const c = counts(data.tests);
    document.getElementById("unitStats").innerHTML =
      stat(data.tests.length, "tests run", "") + stat(c.passed, "passed", "pass") +
      stat(c.failed + c.xpassed, "failed", c.failed + c.xpassed ? "fail" : "pass") +
      stat(c.xfailed, "known issues", c.xfailed ? "warn" : "pass") + stat(c.skipped, "skipped", "skip") +
      stat(data.seconds + " s", "total time", "");
    const groups = {};
    data.tests.forEach(t => (groups[t.file] = groups[t.file] || []).push(t));
    document.getElementById("unitList").innerHTML = Object.entries(groups).map(([f, ts]) =>
      `<div class="group"><h3>${esc(FILE_LABEL[f] || f)} <span class="muted">(${ts.length})</span></h3>` +
      ts.map(t => `<div class="row"><span class="ic ${t.outcome}">${ICON[t.outcome] || "?"}</span>
        <span>${esc(t.doc)}</span><span class="t">${t.duration < 0.01 ? "<0.01" : t.duration.toFixed(2)} s</span>
        ${t.outcome !== "passed" && t.reason ? `<span class="why">${esc(t.reason.split("\n").slice(-1)[0].slice(0, 160))}</span>` : ""}</div>`).join("") +
      `</div>`).join("");
  }
  if (view === "summary") {
    const e = data.e2e, u = counts(data.unit);
    const e2eFail = e.filter(t => t.status !== "pass").length;
    const bad = e2eFail + u.failed + u.xpassed;
    const v = document.getElementById("verdict");
    v.className = "verdict " + (bad ? "fail" : "pass");
    v.textContent = bad ? `${bad} check${bad > 1 ? "s" : ""} failed` : "All checks passed";
    document.getElementById("sumStats").innerHTML =
      stat(`${e.length - e2eFail}/${e.length}`, "browser tests passed", e2eFail ? "fail" : "pass") +
      (data.unit.length ? stat(`${u.passed}/${data.unit.length}`, "suite tests passed", u.failed ? "fail" : "pass") +
        stat(u.xfailed, "known issues", u.xfailed ? "warn" : "pass") : "") +
      stat(data.checks, "on-screen checks", "");
    document.getElementById("sumE2E").innerHTML = e.map(t =>
      `<div class="row"><span class="ic ${t.status === "pass" ? "passed" : "failed"}">${t.status === "pass" ? "✓" : "✗"}</span>
       <span>${esc(t.name)}</span><span class="t">${(t.ms / 1000).toFixed(1)} s</span></div>`).join("");
    const issues = [
      ...e.filter(t => t.status !== "pass").map(t => `<div class="issue fail"><b>${esc(t.name)}</b><br>${esc(t.error)}</div>`),
      ...data.unit.filter(t => t.outcome === "failed" || t.outcome === "xpassed").map(t => `<div class="issue fail"><b>${esc(t.doc)}</b><br><span class="muted">${esc(t.nodeid)}</span></div>`),
      ...data.unit.filter(t => t.outcome === "xfailed").map(t => `<div class="issue"><b>Known issue:</b> ${esc(t.reason.replace(/^APP BUG:\s*/, ""))}</div>`),
    ];
    document.getElementById("sumIssues").innerHTML = issues.join("") || `<div class="muted">Nothing. Every check passed.</div>`;
  }
};

// Slow auto-scroll for the long unit-test board.
window.autoScroll = (ms) => {
  const box = document.getElementById("unitScroll"), max = box.scrollHeight - box.clientHeight;
  if (max <= 0) return;
  const t0 = performance.now(), hold = 1500;
  const step = now => {
    const p = Math.min(1, Math.max(0, (now - t0 - hold) / (ms - 2 * hold)));
    box.scrollTop = max * p;
    if (p < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
};

// Opened directly (the saved report), render everything from the embedded data.
if (window.REPORT) {
  document.querySelectorAll(".view").forEach(v => v.classList.add("on"));
  render("unit", REPORT); render("summary", REPORT); render("title", REPORT.title);
  document.querySelectorAll(".view").forEach(v => v.classList.add("on"));
  document.getElementById("unitScroll").style.height = "auto";
}
</script>
</body>
</html>
