# Step 2 of the safe two-step workflow. Runs from the default branch with write
# access, but never checks out or runs PR code. It only handles the artifact
# as data (two GIFs and two text files).
name: pr-proof-spike-comment

on:
  workflow_run:
    workflows: ["pr-proof-spike-run"]   # must match `name:` in spike-run.yml
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  comment:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact from the triggering run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pr-proof-spike
          path: artifact
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify PR number belongs to the triggering run's head SHA
        id: verify
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const prNumber = parseInt(fs.readFileSync('artifact/pr-number.txt', 'utf8').trim(), 10);
            const claimedSha = fs.readFileSync('artifact/head-sha.txt', 'utf8').trim();
            const runSha = context.payload.workflow_run.head_sha;
            if (!Number.isInteger(prNumber) || prNumber <= 0) core.setFailed('Bad PR number in artifact');
            if (claimedSha !== runSha) core.setFailed(`Artifact SHA ${claimedSha} != run SHA ${runSha}`);
            // Ask the API which PRs this commit belongs to; ours must be one of them.
            const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner, repo: context.repo.repo, commit_sha: runSha,
            });
            if (!prs.some(p => p.number === prNumber)) {
              core.setFailed(`PR #${prNumber} is not associated with commit ${runSha}`);
            }
            core.setOutput('pr', String(prNumber));
            core.setOutput('short', runSha.slice(0, 7));

      - name: Push GIFs to pr-proof-previews branch
        env:
          PR: ${{ steps.verify.outputs.pr }}
          SHORT: ${{ steps.verify.outputs.short }}
          REPO: ${{ github.repository }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          URL="https://x-access-token:${TOKEN}@github.com/${REPO}.git"
          if git ls-remote --exit-code --heads "$URL" pr-proof-previews >/dev/null 2>&1; then
            git clone --depth 1 --branch pr-proof-previews "$URL" previews
          else
            mkdir previews
            git -C previews init -q -b pr-proof-previews
            git -C previews remote add origin "$URL"
          fi
          cd previews
          mkdir -p "pr-${PR}"
          cp ../artifact/small.gif "pr-${PR}/${SHORT}-small.gif"
          cp ../artifact/large.gif "pr-${PR}/${SHORT}-large.gif"
          git config user.name "pr-proof[bot]"
          git config user.email "pr-proof-bot@users.noreply.github.com"
          git add .
          git commit -q -m "preview for PR #${PR} at ${SHORT}"
          git push origin pr-proof-previews

      - name: Create or update the sticky comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR: ${{ steps.verify.outputs.pr }}
          SHORT: ${{ steps.verify.outputs.short }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const pr = parseInt(process.env.PR, 10);
            const short = process.env.SHORT;
            const marker = '<!-- pr-proof:sticky -->';
            const blob = (f) => `https://github.com/${owner}/${repo}/blob/pr-proof-previews/pr-${pr}/${short}-${f}.gif?raw=true`;
            const raw = (f) => `https://raw.githubusercontent.com/${owner}/${repo}/pr-proof-previews/pr-${pr}/${short}-${f}.gif`;
            const body = [
              marker,
              `## pr-proof GIF spike (commit ${short})`,
              '',
              '### Form A: github.com/blob/...?raw=true',
              `Small (~5 MB): ![small A](${blob('small')})`,
              '',
              `Large (~9 MB): ![large A](${blob('large')})`,
              '',
              '### Form B: raw.githubusercontent.com',
              `Small (~5 MB): ![small B](${raw('small')})`,
              '',
              `Large (~9 MB): ![large B](${raw('large')})`,
            ].join('\n');
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: pr, per_page: 100,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: pr, body });
            }
