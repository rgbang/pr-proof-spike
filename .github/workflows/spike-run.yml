# Step 1 of the safe two-step workflow. Runs on PR code, so it has read-only
# access and no secrets. It only produces files; it never talks to the PR.
name: pr-proof-spike-run

on:
  pull_request:

permissions:
  contents: read

jobs:
  make-gifs:
    runs-on: ubuntu-latest
    steps:
      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Make sample GIFs (about 5 MB and about 9 MB)
        run: |
          mkdir -p out
          ffmpeg -v error -y -f lavfi -i "testsrc2=size=480x270:rate=10:duration=7" \
            -vf "noise=alls=20:allf=t" out/small.gif </dev/null
          ffmpeg -v error -y -f lavfi -i "testsrc2=size=640x360:rate=10:duration=7.5" \
            -vf "noise=alls=20:allf=t" out/large.gif </dev/null
          ls -l out

      - name: Record PR number and head SHA
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          printf '%s\n' "$PR_NUMBER" > out/pr-number.txt
          printf '%s\n' "$HEAD_SHA" > out/head-sha.txt

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pr-proof-spike
          path: out/
          retention-days: 1
