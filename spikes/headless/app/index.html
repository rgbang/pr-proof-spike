<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Tiny To-do</title>
<style>
body{font-family:system-ui,sans-serif;background:#f4f6fb;margin:0;padding:48px;color:#1c2333}
main{max-width:640px;margin:0 auto;background:#fff;border-radius:14px;padding:28px;box-shadow:0 4px 18px #0002}
h1{margin-top:0}form{display:flex;gap:8px}input[type=text]{flex:1;padding:10px;font-size:18px;border:1px solid #bbb;border-radius:8px}
button{padding:10px 16px;font-size:16px;border:0;border-radius:8px;background:#2f6fed;color:#fff;cursor:pointer}
ul{list-style:none;padding:0}li{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #eee;font-size:18px}
li.done span{text-decoration:line-through;color:#888}li span{flex:1}
.filters{display:flex;gap:8px;margin:14px 0}.filters button{background:#e4e9f5;color:#1c2333}.filters button.active{background:#2f6fed;color:#fff}
#error{color:#b00020;min-height:1.2em}#count{color:#555}
</style></head><body><main>
<h1>Tiny To-do</h1>
<form id="add-form"><input type="text" id="new-task" placeholder="What needs doing?" aria-label="New task"><button type="submit" id="add-btn">Add</button></form>
<div id="error"></div>
<div class="filters"><button data-filter="all" class="active">All</button><button data-filter="active">Active</button><button data-filter="done">Done</button></div>
<ul id="list"></ul>
<div id="count"></div>
<button id="clear-done">Clear completed</button>
</main>
<script>
let tasks = JSON.parse(localStorage.getItem("tasks") || "[]"), filter = "all", nextId = Date.now();
function save(){ localStorage.setItem("tasks", JSON.stringify(tasks)); }
function render(){
  const list = document.getElementById("list"); list.innerHTML = "";
  tasks.filter(t => filter === "all" || (filter === "done") === t.done).forEach(t => {
    const li = document.createElement("li"); li.dataset.id = t.id; if (t.done) li.className = "done";
    const cb = document.createElement("input"); cb.type = "checkbox"; cb.checked = t.done; cb.className = "toggle";
    cb.onchange = () => { t.done = cb.checked; save(); render(); };
    const sp = document.createElement("span"); sp.textContent = t.text;
    const del = document.createElement("button"); del.textContent = "Delete"; del.className = "del";
    del.onclick = () => { tasks = tasks.filter(x => x !== t); save(); render(); };
    li.append(cb, sp, del); list.append(li);
  });
  const left = tasks.filter(t => !t.done).length;
  document.getElementById("count").textContent = left + (left === 1 ? " task left" : " tasks left");
  document.querySelectorAll(".filters button").forEach(b => b.classList.toggle("active", b.dataset.filter === filter));
}
document.getElementById("add-form").onsubmit = e => {
  e.preventDefault();
  const inp = document.getElementById("new-task"), text = inp.value.trim();
  if (!text) { document.getElementById("error").textContent = "Please type a task first."; return; }
  document.getElementById("error").textContent = "";
  tasks.push({id: nextId++, text, done: false}); inp.value = ""; save(); render();
};
document.querySelectorAll(".filters button").forEach(b => b.onclick = () => { filter = b.dataset.filter; render(); });
document.getElementById("clear-done").onclick = () => { tasks = tasks.filter(t => !t.done); save(); render(); };
render();
</script></body></html>
